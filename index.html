<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your-Rank</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      font-size: 20px;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #555;
    }

    label {
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
    }

    #loading {
      display: none;
      text-align: center;
      margin-top: 15px;
    }

    #result {
      display: none;
      margin-top: 20px;
    }

    .result-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    .result-title {
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      background: #eee;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 11px 14px;
      border-top: 1px solid #eee;
      gap: 15px;
    }

    .row span:first-child {
      font-weight: bold;
    }

    .row span:last-child {
      text-align: right;
    }

    .score {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      padding: 15px;
    }

    .error {
      margin-top: 15px;
      padding: 12px;
      background: #ffe5e5;
      color: #b00000;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>YOUR-RANK</h1>

  <h2>माथाडी कामगार Direct Recruitment 2026 Exam</h2>

  <p class="subtitle">Rank & Score Analysis</p>

  <label>Response Sheet URL</label>
  <br><br>

  <input
    type="text"
    id="tcsUrl"
    placeholder="Paste your response sheet URL here"
  >

  <br><br>

  <label>Category</label>

  <select id="category">
    <option value="">Select Category</option>
    <option value="Open">Open</option>
    <option value="SC">SC</option>
    <option value="ST">ST</option>
    <option value="VJA">VJA</option>
    <option value="OBC">OBC</option>
    <option value="SEBC">SEBC</option>
  </select>

  <br><br>

  <label>Gender</label>

  <select id="gender">
    <option value="">Select Gender</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
  </select>

  <br><br>

  <label>Horizontal Reservation</label>

  <select id="horizontal">
    <option value="None">None</option>
    <option value="Female">Female</option>
    <option value="Ex-Servicemen">Ex-Servicemen</option>
  </select>

  <br><br>

  <button id="submitBtn" onclick="submitCandidate()">
    SUBMIT
  </button>

  <div id="loading">
    Processing response sheet...
  </div>

  <div id="error"></div>

  <div id="result">

    <div class="result-card">

      <div class="result-title">
        Candidate Result
      </div>

      <div class="score" id="score"></div>

      <div class="row">
        <span>Name</span>
        <span id="name"></span>
      </div>

      <div class="row">
        <span>Roll Number</span>
        <span id="roll"></span>
      </div>

      <div class="row">
        <span>Center</span>
        <span id="center"></span>
      </div>

      <div class="row">
        <span>Exam Date</span>
        <span id="date"></span>
      </div>

      <div class="row">
        <span>Exam Time</span>
        <span id="time"></span>
      </div>

      <div class="row">
        <span>Post</span>
        <span id="post"></span>
      </div>

      <div class="row">
        <span>Shift</span>
        <span id="shift"></span>
      </div>

      <div class="row">
        <span>Category</span>
        <span id="categoryResult"></span>
      </div>

      <div class="row">
        <span>Gender</span>
        <span id="genderResult"></span>
      </div>

      <div class="row">
        <span>Horizontal Reservation</span>
        <span id="horizontalResult"></span>
      </div>

      <div class="row">
        <span>Total Questions</span>
        <span id="questions"></span>
      </div>

    </div>

  </div>

</div>


<script>

async function submitCandidate() {
 

  const tcsUrl =
    document.getElementById("tcsUrl").value.trim();

  const category =
    document.getElementById("category").value;

  const gender =
    document.getElementById("gender").value;

  const horizontal =
    document.getElementById("horizontal").value;


  if (!tcsUrl) {
    alert("Please paste your response sheet URL.");
    return;
  }


  if (!category) {
    alert("Please select your category.");
    return;
  }


  if (!gender) {
    alert("Please select your gender.");
    return;
  }


  const submitBtn =
    document.getElementById("submitBtn");

  const loading =
    document.getElementById("loading");

  const result =
    document.getElementById("result");

  const error =
    document.getElementById("error");


  submitBtn.disabled = true;

  loading.style.display = "block";

  result.style.display = "none";

  error.innerHTML = "";


  try {

    const workerUrl =
      "https://your-rank-api.c2721383.workers.dev";


    const submitUrl =
      workerUrl +
      "/submit?url=" +
      encodeURIComponent(tcsUrl) +
      "&category=" +
      encodeURIComponent(category) +
      "&gender=" +
      encodeURIComponent(gender) +
      "&horizontal=" +
      encodeURIComponent(horizontal);


    const response =
      await fetch(submitUrl);


    const data =
      await response.json();
document.getElementById("name").textContent =
  data.candidate.name || "-";

document.getElementById("roll").textContent =
  data.candidate.roll_number || "-";

document.getElementById("center").textContent =
  data.candidate.center || "-";

document.getElementById("date").textContent =
  data.candidate.test_date || "-";

document.getElementById("time").textContent =
  data.candidate.test_time || "-";

document.getElementById("post").textContent =
  data.candidate.post || "-";

    if (!data.success) {

      throw new Error(
        data.error || "Submission failed."
      );

    }


    document.getElementById("score").textContent =
      "Score: " + data.score;


    document.getElementById("categoryResult").textContent =
      data.category;


    document.getElementById("genderResult").textContent =
      data.gender;


    document.getElementById("horizontalResult").textContent =
      data.horizontal_reservation;


    document.getElementById("shift").textContent =
      data.shift;


    document.getElementById("questions").textContent =
      data.total_questions;


    /*
      Candidate details are returned
      after the next Worker update.
    */

    result.style.display = "block";


  } catch (error) {

    console.log(error);

    error.innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';

  }


  loading.style.display = "none";

  submitBtn.disabled = false;

}

</script>

</body>
  </html>
