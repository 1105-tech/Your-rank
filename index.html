<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your-Rank</title>
</head>

<body>

  <h1>YOUR-RANK</h1>

  <p>TCS Exam Rank & Score Analysis</p>

  <label>TCS Response Sheet URL</label>
  <br><br>

  <input type="text" placeholder="Paste your TCS URL here">

  <br><br>

  <button onclick="testTCS()">SUBMIT</button>

<script>
async function testTCS() {

    const url = document.querySelector("input").value;

    if (!url) {
        alert("Please paste your TCS Response Sheet URL.");
        return;
    }

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Unable to access response sheet");
        }

        const html = await response.text();

        console.log(html);

        alert("TCS response sheet accessed successfully!");

    } catch (error) {

        console.log(error);

        alert("TCS response sheet could not be accessed directly.");

    }
}
</script>
</body>
</html>
